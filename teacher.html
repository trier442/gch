<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>과천외고 교사용 성적 관리</title><style>body{font-family:system-ui,'Malgun Gothic',sans-serif;background:#f4f6fa;color:#24364b;margin:0}header{background:#173759;color:white;padding:22px}main{max-width:1100px;margin:auto;padding:20px}.card{background:white;border:1px solid #dfe5ee;border-radius:12px;padding:20px;margin-bottom:16px}input,button,select{padding:10px;border-radius:7px;border:1px solid #cbd5e1;font:inherit;margin:4px}button{background:#20578d;color:white;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left}th{background:#edf3fa}.scroll{overflow:auto}.muted{color:#64748b}.bad{color:#ad3030}.hidden{display:none}details{padding:10px;border-bottom:1px solid #ddd}summary{cursor:pointer}#status{min-height:22px}</style></head><body><header><h2>과천외고 · 교사용 성적 관리</h2>학생별 시험 점수와 오답 확인</header><nav style="padding:12px 22px;background:#e8f2fa"><a href="index.html" style="margin-right:16px;color:#175b81">음운 학습</a><a href="textbook.html" style="margin-right:16px;color:#175b81">교과서 테스트</a><a href="final62.html" style="margin-right:16px;color:#137559;font-weight:750">최종 파이널 62문항</a><a href="teacher.html" style="color:#175b81;font-weight:750">교사용 성적 관리</a></nav><main><div class="card" id="loginBox"><h3>교사 로그인</h3><p class="muted">Supabase Authentication에 등록한 교사용 이메일 계정으로 로그인합니다. 관리 페이지의 열람 권한은 서버의 RLS 정책으로 제한됩니다.</p><input id="email" type="email" placeholder="교사용 이메일"><input id="password" type="password" placeholder="비밀번호"><button id="login">로그인</button></div><div class="card hidden" id="dashboard"><button id="logout">로그아웃</button><button id="reload">성적 새로고침</button><button id="csv">전체 성적 CSV 저장</button><div><label>이름 검색 <input id="filter" placeholder="학생 이름"></label><label>시험 자료 <select id="source"><option value="">전체</option></select></label><label>시험 단원 <select id="topic"><option value="">전체</option></select></label></div><p id="summary"></p><div class="scroll"><table><thead><tr><th>응시 시각</th><th>학생</th><th>자료</th><th>단원</th><th>점수</th><th>정답/전체</th><th>오답</th></tr></thead><tbody id="rows"></tbody></table></div><h3>선택한 학생의 오답 상세</h3><div id="detail" class="muted">표의 오답 버튼을 누르세요.</div></div><p id="status" role="status"></p></main><script src="config.js"></script><script>
const $=id=>document.getElementById(id),cfg=window.EXAM_CONFIG||{};let token='',records=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function status(s){$('status').textContent=s}function ready(){if(!cfg.supabaseUrl||!cfg.supabaseAnonKey){status('연동 전입니다. config.js에 Supabase 프로젝트 URL과 anon key를 입력하고 setup.sql의 교사 조회 정책을 적용하세요.');$('login').disabled=true}}async function api(path,opts={}){const r=await fetch(cfg.supabaseUrl.replace(/\/$/,'')+path,{...opts,headers:{apikey:cfg.supabaseAnonKey,Authorization:'Bearer '+(token||cfg.supabaseAnonKey),'Content-Type':'application/json',...(opts.headers||{})}});if(!r.ok)throw Error('서버 응답 '+r.status+': '+(await r.text()).slice(0,180));return r.status===204?null:r.json()}$('login').onclick=async()=>{try{status('로그인 중…');let v=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});token=v.access_token;$('password').value='';$('loginBox').classList.add('hidden');$('dashboard').classList.remove('hidden');await load()}catch(e){status('로그인 실패: '+e.message)}};$('logout').onclick=()=>{token='';records=[];$('dashboard').classList.add('hidden');$('loginBox').classList.remove('hidden');status('로그아웃했습니다.')};async function load(){try{status('성적 불러오는 중…');records=await api('/rest/v1/exam_results?select=*&order=submitted_at.desc&limit=1000');$('source').innerHTML='<option value="">전체</option>'+[...new Set(records.map(x=>x.exam_source||'음운 수업자료'))].map(x=>`<option>${esc(x)}</option>`).join('');$('topic').innerHTML='<option value="">전체</option>'+[...new Set(records.map(x=>x.topic))].map(x=>`<option>${esc(x)}</option>`).join('');render();status('최근 최대 1,000건을 불러왔습니다.')}catch(e){status('조회 실패: '+e.message)}}function filtered(){let q=$('filter').value.trim().toLowerCase(),t=$('topic').value,src=$('source').value;return records.filter(x=>(!src||(x.exam_source||'음운 수업자료')===src)&&(!t||x.topic===t)&&(!q||String(x.student_name||'').toLowerCase().includes(q)))}function render(){let arr=filtered();$('summary').textContent=`응시 ${arr.length}건 · 평균 ${arr.length?(arr.reduce((a,x)=>a+x.score,0)/arr.length).toFixed(1):'-'}점 · 전체 오답 ${arr.reduce((a,x)=>a+x.answers.filter(y=>!y.is_correct).length,0)}개`;$('rows').innerHTML=arr.map(x=>`<tr><td>${esc(new Date(x.submitted_at).toLocaleString('ko-KR'))}</td><td>${esc(x.student_name)}</td><td>${esc(x.exam_source||'음운 수업자료')}</td><td>${esc(x.topic)}</td><td><b>${x.score}</b></td><td>${x.correct_count}/${x.total_count}</td><td><button data-id="${esc(x.id)}">${x.answers.filter(y=>!y.is_correct).length}개 보기</button></td></tr>`).join('');$('rows').querySelectorAll('button').forEach(b=>b.onclick=()=>detail(b.dataset.id))}function detail(id){let x=records.find(z=>z.id===id);if(!x)return;let wrong=x.answers.filter(y=>!y.is_correct);$('detail').innerHTML=`<p><b>${esc(x.student_name)}</b> | ${x.score}점 | ${esc(x.topic)}</p>`+(wrong.length?wrong.map(y=>`<details><summary class="bad">${y.number}번 · ${esc(y.topic)} · ${esc(y.stem)}</summary><p>학생 답: ${esc(y.chosen??'미응답')}</p><p>정답: <b>${esc(y.correct_answer)}</b></p><p>${esc(y.explanation)}</p></details>`).join(''):'오답이 없습니다.')};$('filter').oninput=render;$('topic').onchange=render;$('source').onchange=render;$('reload').onclick=load;$('csv').onclick=()=>{let arr=filtered(),csv='응시시각,학생,자료,단원,점수,정답수,전체문항,오답수\n'+arr.map(x=>[x.submitted_at,x.student_name,x.exam_source||'음운 수업자료',x.topic,x.score,x.correct_count,x.total_count,x.answers.filter(y=>!y.is_correct).length].map(z=>'"'+String(z).replaceAll('"','""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='과천외고_학생별_성적.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};ready();
</script></body></html>
